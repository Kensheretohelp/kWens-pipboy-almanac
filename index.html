<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>PIP-BOY 3000 — Gardening OS v3.2.1</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="crt"></div>
  <main class="shell">
    <header class="hero">
      <div class="kicker">Vault-Tec Agricultural Division</div>
      <h1>PIP-BOY 3000</h1>
      <div class="version">Gardening OS v3.2.1</div>
    </header>

    <nav class="pip-buttons" aria-label="Pip-Boy sections">
      <button class="pip-btn active" data-tab="stat">STAT</button>
      <button class="pip-btn" data-tab="cal">CAL</button>
      <button class="pip-btn" data-tab="crops">CROPS</button>
      <button class="pip-btn" data-tab="log">LOG</button>
      <button class="pip-btn" data-tab="data">DATA</button>
    </nav>

    <section id="statusStrip" class="status-strip"></section>

    <section id="app" class="content"></section>

    <footer class="footer">PIP-BOY 3000 • Gardening OS v3.2.1 • Riverview / Moncton NB Zone 5b</footer>
  </main>

  <script src="supply-database.js"></script>
  <script src="garden-database.js"></script>
  <script src="my-garden.js"></script>
  <script src="calendar-engine.js"></script>
  <script src="garden-app.js"></script>
</body>
</html>
