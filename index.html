<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>kWen Gardening Almanac</title>
<style>
body{
  margin:0;
  background:#07110a;
  color:#9DFF62;
  font-family:Courier New, monospace;
}
.app{
  display:flex;
  min-height:100vh;
}
.sidebar{
  width:300px;
  background:#0a160d;
  border-right:2px solid #2e6d37;
  padding:16px;
  overflow-y:auto;
}
.main{
  flex:1;
  padding:20px;
}
button,a.link{
  display:block;
  width:100%;
  margin-bottom:8px;
  padding:10px;
  background:#112216;
  border:1px solid #4d9b5f;
  color:#9DFF62;
  border-radius:10px;
  cursor:pointer;
  text-decoration:none;
  box-sizing:border-box;
}
button.active{
  background:#9DFF62;
  color:#07110a;
}
.card{
  border:1px solid #2e6d37;
  border-radius:14px;
  padding:16px;
  margin-bottom:16px;
  background:#0d1b10;
}
.calendar{
  display:grid;
  grid-template-columns:repeat(7,1fr);
  gap:6px;
}
.day{
  min-height:90px;
  border:1px solid #2e6d37;
  border-radius:10px;
  padding:6px;
  background:#102015;
}
.small{
  color:#b9ff9d;
  font-size:.8rem;
}
h1,h2,h3{
  margin-top:0;
}
@media(max-width:900px){
  .app{flex-direction:column;}
  .sidebar{width:auto;border-right:0;border-bottom:2px solid #2e6d37;}
}
</style>
</head>
<body>

<div class="app">
  <div class="sidebar">
    <h2>🌱 Garden Almanac</h2>

    <a class="link" href="https://kensheretohelp.github.io/kWens-cookbook/">
      🍳 Back to Cookbook
    </a>

    <h3>Filter Crops</h3>

    <button onclick="setFilter('all')" id="btn-all" class="active">📡 All Events</button>
    <button onclick="setFilter('tomatoes')" id="btn-tomatoes">🍅 Tomatoes</button>
    <button onclick="setFilter('cucumbers')" id="btn-cucumbers">🥒 Cucumbers</button>
    <button onclick="setFilter('peas')" id="btn-peas">🫛 Peas</button>
    <button onclick="setFilter('waxbeans')" id="btn-waxbeans">🍟 Yellow Wax Beans</button>
    <button onclick="setFilter('beets')" id="btn-beets">🟡 Golden Beets</button>
    <button onclick="setFilter('peppers')" id="btn-peppers">🫑 Green Peppers</button>
    <button onclick="setFilter('garlic')" id="btn-garlic">🧄 Garlic</button>
    <button onclick="setFilter('basil')" id="btn-basil">🌿 Basil</button>
    <button onclick="setFilter('thyme')" id="btn-thyme">🌱 Thyme</button>
  </div>

  <div class="main">

    <div class="card">
      <h1 id="title">📡 All Garden Events</h1>
      <div class="small">
        🌱 Sow • 🪴 Move Outdoors • 💧 Fertilize • 🧺 Harvest
      </div>
    </div>

    <div class="card">
      <h2>June 2026 Calendar</h2>

      <div class="calendar" id="calendar"></div>
    </div>

    <div class="card">
      <h2>This Month</h2>
      <div id="events"></div>
    </div>

  </div>
</div>

<script>

const data = {
  tomatoes: [
    {day:5, icon:"🪴🍅", text:"Move tomatoes outdoors"},
    {day:5, icon:"💧🍅", text:"Fertilize with 10-10-10"},
    {day:25, icon:"💧🍅", text:"Switch to 5-10-10"},
    {day:30, icon:"🧺🍅", text:"Early cherry tomato harvest"}
  ],
  cucumbers: [
    {day:15, icon:"🌱🥒", text:"Second cucumber sowing"},
    {day:15, icon:"💧🥒", text:"Balanced fertilizer"},
    {day:25, icon:"🧺🥒", text:"Begin harvest checks"}
  ],
  peas: [
    {day:2, icon:"🧺🫛", text:"Begin pea harvest"}
  ],
  waxbeans: [
    {day:18, icon:"🌱🍟", text:"Sow yellow wax beans"},
    {day:20, icon:"💧🍟", text:"Very light fertilizer"},
    {day:28, icon:"🧺🍟", text:"Begin wax bean harvest"}
  ],
  beets: [
    {day:10, icon:"🌱🟡", text:"Sow golden beets"},
    {day:18, icon:"💧🟡", text:"Light fertilizer after thinning"},
    {day:15, icon:"🧺🟡", text:"Baby beet harvest window"}
  ],
  peppers: [
    {day:5, icon:"🪴🫑", text:"Move peppers outdoors"},
    {day:5, icon:"💧🫑", text:"Fertilize peppers"},
    {day:25, icon:"💧🫑", text:"5-10-10 fruiting feed"}
  ],
  garlic: [
    {day:20, icon:"💧🧄", text:"Spring garlic feed"}
  ],
  basil: [
    {day:7, icon:"🪴🌿", text:"Move basil outdoors"},
    {day:15, icon:"💧🌿", text:"Light herb feed"},
    {day:30, icon:"🧺🌿", text:"Regular harvest/pinching"}
  ],
  thyme: [
    {day:8, icon:"🪴🌱", text:"Move thyme outdoors"}
  ]
};

let currentFilter = "all";

function allEvents(){
  let arr = [];
  Object.keys(data).forEach(key=>{
    data[key].forEach(ev=>{
      arr.push({...ev, crop:key});
    });
  });
  return arr;
}

function getEvents(){
  if(currentFilter === "all"){
    return allEvents();
  }
  return data[currentFilter] || [];
}

function setFilter(filter){
  currentFilter = filter;

  document.querySelectorAll("button").forEach(btn=>{
    btn.classList.remove("active");
  });

  const activeBtn = document.getElementById("btn-" + filter);
  if(activeBtn){
    activeBtn.classList.add("active");
  }

  const title = document.getElementById("title");

  if(filter === "all"){
    title.innerText = "📡 All Garden Events";
  } else {
    title.innerText = activeBtn.innerText;
  }

  render();
}

function render(){

  const calendar = document.getElementById("calendar");
  calendar.innerHTML = "";

  const events = getEvents();

  for(let i=1;i<=30;i++){

    const div = document.createElement("div");
    div.className = "day";

    let html = "<strong>" + i + "</strong><br>";

    events.forEach(ev=>{
      if(ev.day === i){
        html += ev.icon + "<br>";
      }
    });

    div.innerHTML = html;

    calendar.appendChild(div);
  }

  const eventsDiv = document.getElementById("events");

  eventsDiv.innerHTML = "";

  events.forEach(ev=>{
    const item = document.createElement("div");
    item.style.marginBottom = "10px";
    item.innerHTML = "<strong>" + ev.icon + " June " + ev.day + "</strong><br><span class='small'>" + ev.text + "</span>";
    eventsDiv.appendChild(item);
  });

}

render();

</script>

</body>
</html>
